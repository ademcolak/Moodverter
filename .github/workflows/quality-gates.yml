name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Smoke tests
        run: pnpm run smoke:test

  regression-gate:
    name: regression-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression gate contract
        run: pnpm run smoke:regression-gate

      - name: Publish regression gate summary
        run: |
          echo "## Baseline Regression Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- transition regression tests passed" >> "$GITHUB_STEP_SUMMARY"
